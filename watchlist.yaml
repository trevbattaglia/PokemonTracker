# The whole point of the relay: turn a firehose into the *few* pings you'll act
# on. This list is deliberately narrow -- what you actually want to buy, not
# every sealed product NowInStock tracks.
#
# A product matches a rule when it contains ALL of that rule's `match` terms
# (case-insensitive substring, no fuzzy logic) AND none of the `exclude` terms.
# A list under `match` is an AND: every term must be present.
#
# Reality check on Pokemon Center: NowInStock -- the only live source -- does
# not carry pokemoncenter.com (Incapsula walls it off, and it simply isn't in
# the feed). So "Pokemon Center Edition" ETBs are only visible when a *tracked*
# retailer (Amazon and its marketplace, mostly) resells one. The rule below
# catches exactly that, and stays quiet the rest of the time rather than
# spamming you with generic ETBs.

watchlist:
  # 1. Pokemon Center Edition ETBs, from whatever tracked retailer lists one.
  #    Requires both "Center" and "Elite Trainer Box" so a plain ETB or a
  #    non-ETB Pokemon Center item doesn't match. "Center" (not "Pokemon
  #    Center") on purpose: it matches both the accented "Pokemon" and the
  #    plain spelling retailers use interchangeably. No max_price -- these are
  #    rare and the point is not to miss one, so a markup still pings.
  - match: ["Center", "Elite Trainer Box"]

  # 2. ETBs for the upcoming calendar drops. Neither set is on the feed yet;
  #    these rules wait for their ETB to appear or restock at a tracked
  #    retailer. Caps sit a little above expected MSRP so a normal price
  #    doesn't silently filter a real restock out (a false negative here means
  #    you miss the drop), while still blocking an obvious scalper markup.
  - match: ["30th Celebration", "Elite Trainer Box"]
    max_price: 90.00
  - match: ["Delta Reign", "Elite Trainer Box"]
    max_price: 90.00

# Merch that matches the words above but isn't the sealed ETB you want.
exclude:
  - plush
  - pin collection
  - figure
  - sticker
  - puzzle
  - backpack
  - t-shirt
